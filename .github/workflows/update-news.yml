name: Update beauty news

# 毎日 06:00 JST（21:00 UTC）に国内美容ニュースを1件自動取得してコミット
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch latest beauty news
        run: node scripts/fetch-news.mjs
      - name: Commit if changed
        run: |
          git config user.name "terapp-news-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(news): daily beauty news update"
            git push
          fi
