<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none">
  <defs>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9D29A"/>
      <stop offset="1" stop-color="#B8912F"/>
    </linearGradient>
    <g id="leaf">
      <path d="M0 0 C 15 -11 36 -9 47 6 C 32 13 11 13 0 0 Z" fill="rgba(203,168,95,.10)" stroke="url(#og)" stroke-width="1.2"/>
      <path d="M3 2 C 17 1 32 5 44 8" stroke="url(#og)" stroke-width=".7" opacity=".7"/>
    </g>
    <g id="bloom">
      <g stroke="#E9D29A" stroke-width="1.1">
        <ellipse cx="0" cy="-9" rx="5" ry="9"/>
        <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(72)"/>
        <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(144)"/>
        <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(216)"/>
        <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(288)"/>
      </g>
      <circle r="2.6" fill="#E9D29A"/>
    </g>
  </defs>

  <!-- stems -->
  <g stroke="url(#og)" stroke-width="1.5" stroke-linecap="round">
    <path d="M14 22 C 72 44 122 96 152 176 C 170 224 192 258 220 296"/>
    <path d="M152 176 C 180 154 216 152 244 162" opacity=".85"/>
    <path d="M92 72 C 110 54 136 50 156 60" opacity=".85"/>
    <path d="M198 244 C 224 232 250 236 270 250" opacity=".7"/>
  </g>

  <!-- leaves -->
  <use href="#leaf" transform="translate(58,46) rotate(34) scale(1.25)"/>
  <use href="#leaf" transform="translate(100,90) rotate(58) scale(1.0)"/>
  <use href="#leaf" transform="translate(136,142) rotate(74) scale(1.35)"/>
  <use href="#leaf" transform="translate(170,150) rotate(-8) scale(1.0)"/>
  <use href="#leaf" transform="translate(206,252) rotate(84) scale(1.15)"/>
  <use href="#leaf" transform="translate(120,64) rotate(-18) scale(.9)"/>

  <!-- blossoms -->
  <use href="#bloom" transform="translate(246,164) scale(1.25)"/>
  <use href="#bloom" transform="translate(158,60) scale(.95)"/>
  <use href="#bloom" transform="translate(276,252) scale(.8)"/>

  <!-- buds / dots -->
  <circle cx="232" cy="118" r="2" fill="#E9D29A"/>
  <circle cx="122" cy="122" r="1.6" fill="#CBA85F"/>
  <circle cx="188" cy="206" r="1.6" fill="#CBA85F"/>
</svg>
