<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2E2B4"/>
      <stop offset=".5" stop-color="#CBA85F"/>
      <stop offset="1" stop-color="#95721F"/>
    </linearGradient>
  </defs>
  <g stroke="url(#hg)" stroke-linecap="round" fill="none">
    <!-- L bracket (frame corner) -->
    <path d="M18 104 L18 18 L104 18" stroke-width="1.6"/>
    <path d="M30 80 L30 30 L80 30" stroke-width="1.1" opacity=".6"/>
    <!-- elegant diagonal sweep -->
    <path d="M20 20 C 78 46 118 86 146 146" stroke-width="1.3" opacity=".85"/>
    <!-- fine fan rays from the corner -->
    <path d="M22 22 L 158 44" stroke-width=".9" opacity=".32"/>
    <path d="M22 22 L 116 116" stroke-width=".9" opacity=".28"/>
    <path d="M22 22 L 44 158" stroke-width=".9" opacity=".32"/>
    <!-- ringed accent -->
    <circle cx="150" cy="150" r="6.5" stroke-width="1.2"/>
    <circle cx="150" cy="150" r="2" fill="#F2E2B4" stroke="none"/>
  </g>
  <!-- deco diamonds -->
  <path d="M104 18 l 9 -6 l 9 6 l -9 6 z" fill="url(#hg)"/>
  <path d="M18 104 l -6 9 l 6 9 l 6 -9 z" fill="url(#hg)"/>
  <circle cx="128" cy="24" r="2" fill="#F2E2B4"/>
  <circle cx="24" cy="128" r="2" fill="#F2E2B4"/>
</svg>
