<script src="assets/terapp.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var PRODUCTS = window.TERAPP_PRODUCTS||[];
  var grid = document.getElementById('product-grid');
  var STATUS = {'available':['available','Available'],'coming-soon':['coming','Coming Soon'],'sold-out':['','Sold Out'],'discontinued':['','販売終了']};
  var PH = '<svg class="pm-ph" viewBox="0 0 120 150" style="display:none" aria-hidden="true"><rect x="24" y="16" width="72" height="118" rx="16" fill="none" stroke="#E99AAD" stroke-width="2"/><ellipse cx="60" cy="66" rx="26" ry="18" fill="none" stroke="#C9A86A" stroke-width="2"/></svg>';
  function render(filter){
    grid.innerHTML='';
    var list = PRODUCTS.filter(function(p){ return filter==='all' || p.category.indexOf(filter)>-1; });
    if(!list.length){ grid.innerHTML='<p class="journal-empty">該当する商品は準備中です。</p>'; return; }
    list.forEach(function(p,i){
      var st = STATUS[p.status]||['',''];
      var actionLabel = p.status==='available' ? '詳細を見る' : '詳細を見る';
      var priceHTML = p.price ? (p.price.toLocaleString('ja-JP')+'<small>円〜</small>') : '<small>'+p.priceLabel+'</small>';
      grid.insertAdjacentHTML('beforeend',
        '<a class="product-card reveal" '+(i?'data-d="'+Math.min(i,3)+'"':'')+' href="'+p.slug+'" data-ev="product_detail_view" style="text-decoration:none">'+
          '<div class="product-media">'+
            (st[0]?'<span class="product-status '+st[0]+'">'+st[1]+'</span>':'<span class="product-status">'+st[1]+'</span>')+
            '<img src="'+p.image+'" alt="'+p.name+'" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">'+PH+
          '</div>'+
          '<div class="product-body">'+
            '<span class="product-cat">'+p.catLabel+'</span>'+
            '<h3>'+p.name+'</h3><p class="p-jp">'+p.japaneseName+'</p>'+
            '<p class="p-desc">'+p.shortDescription+'</p>'+
            '<div class="product-price">'+priceHTML+'</div>'+
            '<div class="product-actions"><span class="btn '+(p.status==='available'?'btn-primary':'btn-ghost')+' sm">'+actionLabel+'</span></div>'+
          '</div>'+
        '</a>');
    });
    // re-run reveal for freshly added
    grid.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('in'); });
  }
  render('all');
  document.querySelectorAll('.filter-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.filter-btn').forEach(function(b){ b.setAttribute('aria-pressed', b===btn); });
      render(btn.getAttribute('data-filter'));
    });
  });
});
</script>
