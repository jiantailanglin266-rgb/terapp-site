    <div class="sec-head center reveal">
      <span class="eyebrow">Daily Beauty News</span>

  </div>

<!-- ブランドのコラム -->
<section class="section">
  <div class="wrap">
    <div class="sec-head center reveal">
      <span class="eyebrow">TERAPP Journal</span>
      <h2 class="sec-title">ブランドのコラム</h2>
      <div class="s-line"></div>
    </div>
    <div class="filter-bar" role="group" aria-label="カテゴリーで絞り込み">
      <button class="filter-btn" data-filter="all" aria-pressed="true">All</button>
      <button class="filter-btn" data-filter="NEWS" aria-pressed="false">News</button>
      <button class="filter-btn" data-filter="BEAUTY" aria-pressed="false">Beauty</button>
      <button class="filter-btn" data-filter="TECHNOLOGY" aria-pressed="false">Technology</button>
      <button class="filter-btn" data-filter="HOW TO USE" aria-pressed="false">How to Use</button>
    </div>
    <div class="journal-grid" id="journal-grid"></div>
  </div>
</section>

<section class="section" style="background:var(--soft)">
  <div class="wrap-narrow center">
    <div class="sec-head reveal"><span class="eyebrow">Follow</span><h2 class="sec-title">最新情報を、<br>お見逃しなく。</h2><div class="s-line"></div></div>
    <div class="social-strip reveal" data-d="1" id="social-strip"></div>
    <p class="form-note reveal" data-d="2" style="margin-top:1.4rem">※公式SNSアカウントURLは準備中です。</p>
  </div>

<script src="data/journal.js" defer></script>
<script src="assets/terapp.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var J = window.TERAPP_JOURNAL||[];
  var grid = document.getElementById('journal-grid');
  function render(filter){
    grid.innerHTML='';
    var list = J.filter(function(a){ return filter==='all' || a.cat===filter; });
    if(!list.length){ grid.innerHTML='<p class="journal-empty">該当する記事は準備中です。</p>'; return; }
    list.forEach(function(a){
      grid.insertAdjacentHTML('beforeend',
        '<a class="journal-card" href="'+a.href+'" data-ev="journal_open"><div class="journal-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="#E99AAD" stroke-width="1.2" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M4 9h16M9 5v14"/></svg></div><div class="journal-body"><div class="journal-meta"><span class="journal-cat">'+a.cat+'</span><span class="journal-date">'+a.date+'</span></div><h3>'+a.title+'</h3><p>'+a.excerpt+'</p><span class="read">Read more →</span></div></a>');
    });
  }
  render('all');
  document.querySelectorAll('.filter-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.filter-btn').forEach(function(b){ b.setAttribute('aria-pressed', b===btn); });
      render(btn.getAttribute('data-filter'));
    });
  });
  /* social strip (共通ヘルパー = ヘッダー/フッターと同一の3アイコン) */
  var strip=document.getElementById('social-strip');
  if(strip && window.terappSocialHTML){ strip.innerHTML = window.terappSocialHTML(); }

  /* 美容ニュース（自動取得: data/news.json）— 外部由来のため全項目エスケープ */
  (function(){
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    var ng=document.getElementById('news-grid'); if(!ng) return;
    ng.innerHTML='<p class="journal-empty">最新の美容ニュースを読み込んでいます…</p>';
    // 毎日更新される配信元(GitHub Actions が更新・CORS許可)を優先し、失敗時はローカルにフォールバック
    var REMOTE='https://jiantailanglin266-rgb.github.io/terapp-site/data/news.json';
    function load(u){ return fetch(u,{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); }); }
    load(REMOTE).catch(function(){ return load('data/news.json'); }).then(function(d){
      var items=(d&&d.items)||[];
      if(!items.length){ ng.innerHTML='<p class="journal-empty">最新の美容ニュースを取得しています。しばらくお待ちください。</p>'; return; }
      ng.innerHTML='';
      items.slice(0,12).forEach(function(a){
        var url = /^https?:\/\//.test(a.url) ? a.url : '#';
        var date = esc(a.date).replace(/-/g,'.');
        ng.insertAdjacentHTML('beforeend',
          '<a class="journal-card" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" data-ev="news_open">'+
            '<div class="journal-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="#E9D29A" stroke-width="1.1" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 12h8M8 15h5"/></svg></div>'+
            '<div class="journal-body"><div class="journal-meta"><span class="journal-cat">NEWS</span><span class="journal-date">'+date+'</span></div>'+
            '<h3>'+esc(a.title)+'</h3>'+
            (a.excerpt?'<p>'+esc(a.excerpt)+'</p>':'')+
            '<span class="read">'+esc(a.source)+' ↗</span></div></a>');
      });
      var up=document.getElementById('news-updated');
      if(up && d.updated){ var u=new Date(d.updated); if(!isNaN(u)) up.textContent=' 最終更新: '+u.toLocaleDateString('ja-JP'); }
    }).catch(function(){ ng.innerHTML='<p class="journal-empty">ニュースの読み込みに失敗しました。時間をおいて再度お試しください。</p>'; });
  })();
});
</script>
