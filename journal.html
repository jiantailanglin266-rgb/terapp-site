<style>

<section class="page-hero">

  <p class="ph-sub">ブランドの最新情報、美容コラム、商品情報、<br>使い方やテクノロジーの解説をお届けします。</p>
  <div class="s-line"></div>
</section>
<div id="breadcrumbs"></div>

<main id="main">
<section class="section" style="background:linear-gradient(180deg,#fff,#FFF9FB)">
  <div class="wrap">
    <div class="filter-bar" role="group" aria-label="カテゴリーで絞り込み">
      <button class="filter-btn" data-filter="all" aria-pressed="true">All</button>
      <button class="filter-btn" data-filter="NEWS" aria-pressed="false">News</button>
      <button class="filter-btn" data-filter="BEAUTY" aria-pressed="false">Beauty</button>
      <button class="filter-btn" data-filter="TECHNOLOGY" aria-pressed="false">Technology</button>
      <button class="filter-btn" data-filter="HOW TO USE" aria-pressed="false">How to Use</button>
    </div>
    <div class="journal-grid" id="journal-grid"></div>
  </div>
</section>

<section class="section" style="background:var(--soft)">
  <div class="wrap-narrow center">
    <div class="sec-head reveal"><span class="eyebrow">Follow</span><h2 class="sec-title">最新情報を、<br>お見逃しなく。</h2><div class="s-line"></div></div>
    <div class="social-strip reveal" data-d="1" id="social-strip"></div>
    <p class="form-note reveal" data-d="2" style="margin-top:1.4rem">※公式SNSアカウントURLは準備中です。</p>
  </div>
</section>
</main>

<script src="data/journal.js" defer></script>
<script src="assets/terapp.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var J = window.TERAPP_JOURNAL||[];
  var grid = document.getElementById('journal-grid');
  function render(filter){
    grid.innerHTML='';
    var list = J.filter(function(a){ return filter==='all' || a.cat===filter; });
    if(!list.length){ grid.innerHTML='<p class="journal-empty">該当する記事は準備中です。</p>'; return; }
    list.forEach(function(a){
      grid.insertAdjacentHTML('beforeend',
        '<a class="journal-card" href="'+a.href+'" data-ev="journal_open"><div class="journal-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="#E99AAD" stroke-width="1.2" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M4 9h16M9 5v14"/></svg></div><div class="journal-body"><div class="journal-meta"><span class="journal-cat">'+a.cat+'</span><span class="journal-date">'+a.date+'</span></div><h3>'+a.title+'</h3><p>'+a.excerpt+'</p><span class="read">Read more →</span></div></a>');
    });
  }
  render('all');
  document.querySelectorAll('.filter-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.filter-btn').forEach(function(b){ b.setAttribute('aria-pressed', b===btn); });
      render(btn.getAttribute('data-filter'));
    });
  });
  /* social strip */
  var S=window.TERAPP_SOCIAL||{},strip=document.getElementById('social-strip');
  var IC={instagram:'IG',tiktok:'TT',youtube:'YT',x:'X',line:'LINE'};
  if(strip) Object.keys(IC).forEach(function(k){ var u=S[k]; strip.insertAdjacentHTML('beforeend','<a href="'+(u||'#')+'"'+(u?'':' hidden')+' target="_blank" rel="noopener" data-social="'+k+'" data-ev="sns_click" aria-label="TERAPP '+k+'" style="font-family:var(--sans);font-size:.6rem;letter-spacing:.1em">'+IC[k]+'</a>'); });
});
</script>
</body>
